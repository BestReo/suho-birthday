<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3ea">
  <title>🎁 수호 생일 선물 상자</title>

  <!-- 카톡 링크 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bestreo.github.io/suho-birthday/">
  <meta property="og:title" content="🎂 수호야, 생일 선물 도착했어!">
  <meta property="og:description" content="선물 상자를 열어봐 🎁">
  <meta property="og:image" content="https://bestreo.github.io/suho-birthday/thumbnail.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="home.css">
</head>
<body class="home">
  <div class="balloons" aria-hidden="true">
    <span style="--x:6%;--d:0s;--s:9s">🎈</span>
    <span style="--x:22%;--d:3s;--s:11s">🎈</span>
    <span style="--x:78%;--d:1.5s;--s:10s">🎈</span>
    <span style="--x:92%;--d:5s;--s:12s">🎈</span>
    <span style="--x:50%;--d:7s;--s:13s">🎉</span>
  </div>

  <main id="home">
    <header class="h-title">
      <h1 id="homeTitle">수호야<br>생일 축하해!</h1>
      <p id="homeSub">선물 상자를 눌러서 열어봐 🎁</p>
    </header>

    <button id="giftBox" class="gift" aria-label="선물 상자 열기">
      <span class="lid"><span class="bow">🎀</span></span>
      <span class="body"></span>
    </button>

    <section id="games" hidden>
      <a class="game-card" href="merge.html">
        <img src="photos/stage4.jpg" alt="">
        <div class="gc-text">
          <h2>🍉 수호 합치기</h2>
          <p>같은 수호끼리 합쳐서 케이크를 만들어봐</p>
          <span class="rec" id="recMerge"></span>
        </div>
        <span class="go">▶</span>
      </a>
      <a class="game-card" href="jump.html">
        <img src="photos/stage9.jpg" alt="">
        <div class="gc-text">
          <h2>🪜 수호 점프</h2>
          <p>무한의 계단! 100계단 가면 편지 도착 💌</p>
          <span class="rec" id="recJump"></span>
        </div>
        <span class="go">▶</span>
      </a>
      <a class="game-card" href="mole.html">
        <img src="photos/face/07.jpg" alt="">
        <div class="gc-text">
          <h2>🔨 수호 두더지 잡기</h2>
          <p>1분 안에 수호 50마리 잡으면 깜짝 선물 🎂</p>
          <span class="rec" id="recMole"></span>
        </div>
        <span class="go">▶</span>
      </a>
      <a class="game-card" href="stack.html">
        <img src="photos/face/13.jpg" alt="">
        <div class="gc-text">
          <h2>🎂 케이크 쌓기</h2>
          <p>20층 쌓으면 진짜 상장을 줄게 🎖️</p>
          <span class="rec" id="recStack"></span>
        </div>
        <span class="go">▶</span>
      </a>
      <a class="game-card" href="catch.html">
        <img src="photos/face/18.jpg" alt="">
        <div class="gc-text">
          <h2>🎁 선물 받기</h2>
          <p>50점 넘기면 불꽃놀이 + 비밀 쿠폰 🎆</p>
          <span class="rec" id="recCatch"></span>
        </div>
        <span class="go">▶</span>
      </a>
      <p class="from">from. 준우</p>
    </section>
  </main>

  <canvas id="confetti"></canvas>
  <script src="config.js"></script>
  <script src="home.js"></script>
</body>
</html>
